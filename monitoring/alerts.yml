groups:
  - name: code-review-assistant
    rules:
      - alert: ReviewJobsRetryableFailures
        expr: sum(increase(review_job_failures_total{retryable="true"}[10m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Review jobs are repeatedly hitting retryable failures
          description: "{{ $value | humanize }} retryable review job failures occurred in the last 10 minutes."

      - alert: ReviewJobsTerminalFailures
        expr: sum(increase(review_job_failures_total{retryable="false"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Review jobs are hitting terminal failures
          description: "{{ $value | humanize }} non-retryable review job failures occurred in the last 10 minutes."

      - alert: ModelLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, provider, model) (rate(ai_model_latency_seconds_bucket[10m]))) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AI model p95 latency exceeds 60 seconds
          description: "Provider {{ $labels.provider }} model {{ $labels.model }} has elevated latency."

      - alert: GitHubApiFailureRateHigh
        expr: sum(rate(github_api_requests_total{outcome="failure"}[10m])) / clamp_min(sum(rate(github_api_requests_total[10m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GitHub API failure rate exceeds 5%
          description: "GitHub API requests have had a sustained elevated failure rate."
